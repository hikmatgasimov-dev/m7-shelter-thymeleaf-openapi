<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelter — Add Animal</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

  <!-- Navigation — same on every page -->
  <nav>
    <a href="/">Home</a>
    <a href="/animals">All animals</a>
    <a href="/animals/new">Add animal</a>
  </nav>

  <main>
    <h1>Add a new animal</h1>


    <form th:action="@{/animals}" th:object="${form}" method="post">

      <label for="name">Name</label>
      <input id="name" th:field="*{name}" type="text" required placeholder="e.g. Milo"

      <label for="type">Type</label>
      <select id="type"  th:field="*{type}" >
        <option value="">— choose —</option>
        <option value="CAT">Cat</option>
        <option value="DOG">Dog</option>
        <option value="OTHER">Other</option>
      </select>

      <label for="breed">Breed</label>
      <input id="breed"  th:field="*{breed}"  type="text" placeholder="e.g. Siamese">

      <label for="age">Age (years)</label>
      <input id="age"  th:field="*{age}"  type="number" min="0" placeholder="e.g. 3">

      <label for="description">Description</label>
      <textarea id="description"  th:field="*{description}"  rows="3"
                placeholder="A short description of the animal's personality"></textarea>

                  <label for="imageUrl">Image filename</label>
                  <input id="imageUrl" th:field="*{imageUrl}"  type="text"
                    placeholder="luna.jpeg">

      <button type="submit">Add animal</button>
    </form>

    <a href="/animals" class="back-link">← Back to list</a>
  </main>

</body>
</html>
