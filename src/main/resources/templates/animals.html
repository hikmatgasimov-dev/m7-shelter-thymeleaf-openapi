<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelter Animals</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<!-- Navigation — same on every page -->
<nav>
  <a href="/">Home</a>
  <a href="/animals">All animals</a>
  <a href="/animals/new">Add animal</a>
</nav>

<main>
  <h1>Shelter Animals</h1>

  <section aria-label="Animal list">
    <ul>
      <li th:each="animal : ${animals}">
        <img th:src="${animal.imageUrl}"
             th:alt="${animal.name}"
             width="300"
             height="200"
             style="object-fit: cover;">
        <div class="info">
          <strong th:text="${animal.name}">Name</strong>
          — <span th:text="${animal.type}">Type</span>
          | <span th:text="${animal.breed}">Breed</span>
          | Age: <span th:text="${animal.age}">0</span>
          <span th:text="${animal.status}"
                th:class="${animal.status.name() == 'AVAILABLE'} ? 'status-available' : 'status-adopted'">STATUS</span>
          <p th:text="${animal.description}">Description</p>
        </div>
      </li>
    </ul>
  </section>

  <a href="/animals/new">Add new animal</a>
</main>

</body>
</html>
