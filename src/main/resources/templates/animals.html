<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelter Animals</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<!-- Navigation — same on every page -->
<nav>
  <a class="brand" href="/">Animal Shelter</a>
  <a href="/">Home</a>
  <a href="/animals" class="active" aria-current="page">All animals</a>
  <a href="/animals/new">Add animal</a>
  <a href="/swagger-ui/index.html" class="btn secondary" target="_blank" rel="noopener">API documentation (Swagger UI)</a>
</nav>

<main>
  <h1>Shelter Animals</h1>

  <p class="subtitle">Meet the animals waiting for a home.</p>
  <p class="notice" role="status" th:if="${message}" th:text="${message}">Message</p>
  <section aria-label="Animal list">
    <ul class="animal-grid">
      <li class="animal-card" th:each="animal : ${animals}">
        <img th:src="${animal.imageUrl}"
             th:alt="${animal.name}"
             width="300"
             height="200"
             style="object-fit: cover;">
        <div class="info">
          <h2 th:text="${animal.name}">Name</h2>
          <p class="meta">
            <span th:text="${animal.type}">Type</span>
            · <span th:text="${animal.breed}">Breed</span>
            · Age: <span th:text="${animal.age}">0</span>
          </p>
          <span class="badge"
                th:text="${animal.status}"
                th:classappend="${animal.status.name() == 'AVAILABLE'} ? 'status-available' : 'status-adopted'">STATUS</span>
          <p class="description" th:text="${animal.description}">Description</p>
        </div>
      </li>
    </ul>
  </section>

  <a href="/animals/new" class="btn">Add new animal</a>
</main>

</body>
</html>
